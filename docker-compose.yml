version: '3.8'

services:
  app:
    image: evershop/evershop:latest
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: postgres
      REDIS_URL: redis://redis:6379
    networks:
      - myevershop
    depends_on:
      - database
      - redis
    ports:
      - 3000:3000
    volumes:
      # Uploaded/processed images (see lib/admin/uploadImage.ts) — local-disk
      # storage inside the container, persisted across restarts via this
      # named volume so a container recreate doesn't wipe product images.
      - media-data:/app/media

  #The postgres database:
  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - myevershop

  # Cache-aside layer for `lib/cache/middleware.ts` — GraphQL response
  # caching (home/category/product pages, shared header/footer chrome).
  # `getRedis()` degrades gracefully to "no caching" if this is absent, so
  # it's optional infrastructure, not a hard dependency.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - myevershop

networks:
  myevershop:
    name: MyEverShop
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  media-data:
